name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only allow one deployment at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      
      - name: Hydrate wrangler.jsonc (Dummy for tests)
        run: |
          sed -e "s/__DB_NAME__/test-db/g" \
              -e "s/__DB_ID__/00000000-0000-0000-0000-000000000000/g" \
              -e "s/__R2_BUCKET__/test-bucket/g" \
              wrangler.example.jsonc > wrangler.jsonc
              
      - name: Hydrate .dev.vars (Dummy for tests)
        run: cp .dev.vars.example .dev.vars

      - run: npm test -- --run  # run vitest in non-watch mode

  check-size:
    name: Check Bundle Size
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      
      - name: Hydrate wrangler.jsonc (Dummy for size check)
        run: |
          sed -e "s/__DB_NAME__/test-db/g" \
              -e "s/__DB_ID__/00000000-0000-0000-0000-000000000000/g" \
              -e "s/__R2_BUCKET__/test-bucket/g" \
              wrangler.example.jsonc > wrangler.jsonc

      - name: Hydrate .dev.vars (Dummy for size check)
        run: cp .dev.vars.example .dev.vars

      - run: npm run check:size

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, check-size]
    if: github.event_name == 'pull_request'
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Hydrate wrangler.jsonc
        run: |
          sed -e "s/__DB_NAME__/${{ secrets.DB_NAME }}/g" \
              -e "s/__DB_ID__/${{ secrets.DB_ID }}/g" \
              -e "s/__R2_BUCKET__/${{ secrets.R2_BUCKET }}/g" \
              wrangler.example.jsonc > wrangler.jsonc

      # Apply any new D1 migrations to staging
      - name: Run D1 Migrations (Staging)
        run: |
          for file in $(ls db/migrations/*.sql | sort -V); do
            MIGRATION_NAME=$(basename "$file")
            if [[ ! "$MIGRATION_NAME" =~ ^[0-9]{4}_[a-zA-Z0-9_-]+\.sql$ ]]; then
              echo "❌ Error: Invalid migration filename '$MIGRATION_NAME'"
              exit 1
            fi
            echo "🔍 Checking migration: $MIGRATION_NAME"
            
            # Check if migration has already been applied
            # Note: We use || true because the table might not exist on the very first run
            EXISTS=$(npx --no-install wrangler d1 execute GOSTYLENS_DB --remote --env staging --command "SELECT name FROM _migrations WHERE name = '$MIGRATION_NAME'" --json 2>/dev/null | jq -r '.[0].results | length' || echo "0")
            
            if [ "$EXISTS" = "0" ]; then
              echo "⬆️ Applying migration: $MIGRATION_NAME"
              npx --no-install wrangler d1 execute GOSTYLENS_DB --remote --env staging --file="$file"
              
              # Record that the migration was applied
              npx --no-install wrangler d1 execute GOSTYLENS_DB --remote --env staging --command "INSERT INTO _migrations (name) VALUES ('$MIGRATION_NAME')"
            else
              echo "✅ Already applied: $MIGRATION_NAME"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Staging
        run: npx --no-install wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, check-size]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Hydrate wrangler.jsonc
        run: |
          sed -e "s/__DB_NAME__/${{ secrets.DB_NAME }}/g" \
              -e "s/__DB_ID__/${{ secrets.DB_ID }}/g" \
              -e "s/__R2_BUCKET__/${{ secrets.R2_BUCKET }}/g" \
              wrangler.example.jsonc > wrangler.jsonc

      # Apply any new D1 migrations to production
      - name: Run D1 Migrations (Production)
        run: |
          for file in $(ls db/migrations/*.sql | sort -V); do
            MIGRATION_NAME=$(basename "$file")
            if [[ ! "$MIGRATION_NAME" =~ ^[0-9]{4}_[a-zA-Z0-9_-]+\.sql$ ]]; then
              echo "❌ Error: Invalid migration filename '$MIGRATION_NAME'"
              exit 1
            fi
            echo "🔍 Checking migration: $MIGRATION_NAME"
            
            # Check if migration has already been applied
            EXISTS=$(npx --no-install wrangler d1 execute GOSTYLENS_DB --remote --command "SELECT name FROM _migrations WHERE name = '$MIGRATION_NAME'" --json 2>/dev/null | jq -r '.[0].results | length' || echo "0")
            
            if [ "$EXISTS" = "0" ]; then
              echo "⬆️ Applying migration: $MIGRATION_NAME"
              npx --no-install wrangler d1 execute GOSTYLENS_DB --remote --file="$file"
              
              # Record that the migration was applied
              npx --no-install wrangler d1 execute GOSTYLENS_DB --remote --command "INSERT INTO _migrations (name) VALUES ('$MIGRATION_NAME')"
            else
              echo "✅ Already applied: $MIGRATION_NAME"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Production
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
