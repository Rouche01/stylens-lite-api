name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only allow one deployment at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      
      - name: Hydrate wrangler.jsonc (Dummy for tests)
        run: |
          sed -e "s/__DB_NAME__/test-db/g" \
              -e "s/__DB_ID__/00000000-0000-0000-0000-000000000000/g" \
              -e "s/__R2_BUCKET__/test-bucket/g" \
              wrangler.example.jsonc > wrangler.jsonc
              
      - name: Hydrate .dev.vars (Dummy for tests)
        run: cp .dev.vars.example .dev.vars

      - run: npm test -- --run  # run vitest in non-watch mode

  check-size:
    name: Check Bundle Size
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      
      - name: Hydrate wrangler.jsonc (Dummy for size check)
        run: |
          sed -e "s/__DB_NAME__/test-db/g" \
              -e "s/__DB_ID__/00000000-0000-0000-0000-000000000000/g" \
              -e "s/__R2_BUCKET__/test-bucket/g" \
              wrangler.example.jsonc > wrangler.jsonc

      - name: Hydrate .dev.vars (Dummy for size check)
        run: cp .dev.vars.example .dev.vars

      - run: npm run check:size

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, check-size]
    if: github.event_name == 'pull_request'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Hydrate wrangler.jsonc
        run: |
          sed -e "s/__DB_NAME__/${{ secrets.DB_NAME }}/g" \
              -e "s/__DB_ID__/${{ secrets.DB_ID }}/g" \
              -e "s/__R2_BUCKET__/${{ secrets.R2_BUCKET }}/g" \
              wrangler.example.jsonc > wrangler.jsonc

      # Apply any new D1 migrations to staging
      - name: Run D1 Migrations (Staging)
        run: |
          for file in $(ls db/migrations/*.sql | sort -V); do
            MIGRATION_NAME=$(basename "$file")
            echo "🔍 Checking migration: $MIGRATION_NAME"
            
            # Check if migration has already been applied
            # Note: We use || true because the table might not exist on the very first run
            EXISTS=$(npx wrangler d1 execute gostylens-db --remote --env staging --command "SELECT name FROM _migrations WHERE name = '$MIGRATION_NAME'" --json 2>/dev/null | jq -r '.[0].results | length' || echo "0")
            
            if [ "$EXISTS" = "0" ]; then
              echo "⬆️ Applying migration: $MIGRATION_NAME"
              npx wrangler d1 execute gostylens-db --remote --env staging --file="$file"
              
              # Record that the migration was applied
              npx wrangler d1 execute gostylens-db --remote --env staging --command "INSERT INTO _migrations (name) VALUES ('$MIGRATION_NAME')"
            else
              echo "✅ Already applied: $MIGRATION_NAME"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Staging
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, check-size]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Hydrate wrangler.jsonc
        run: |
          sed -e "s/__DB_NAME__/${{ secrets.DB_NAME }}/g" \
              -e "s/__DB_ID__/${{ secrets.DB_ID }}/g" \
              -e "s/__R2_BUCKET__/${{ secrets.R2_BUCKET }}/g" \
              wrangler.example.jsonc > wrangler.jsonc

      # Apply any new D1 migrations to production
      - name: Run D1 Migrations (Production)
        run: |
          for file in $(ls db/migrations/*.sql | sort -V); do
            MIGRATION_NAME=$(basename "$file")
            echo "🔍 Checking migration: $MIGRATION_NAME"
            
            # Check if migration has already been applied
            EXISTS=$(npx wrangler d1 execute gostylens-db-prod --remote --command "SELECT name FROM _migrations WHERE name = '$MIGRATION_NAME'" --json 2>/dev/null | jq -r '.[0].results | length' || echo "0")
            
            if [ "$EXISTS" = "0" ]; then
              echo "⬆️ Applying migration: $MIGRATION_NAME"
              npx wrangler d1 execute gostylens-db-prod --remote --file="$file"
              
              # Record that the migration was applied
              npx wrangler d1 execute gostylens-db-prod --remote --command "INSERT INTO _migrations (name) VALUES ('$MIGRATION_NAME')"
            else
              echo "✅ Already applied: $MIGRATION_NAME"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Production
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
